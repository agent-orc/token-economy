name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Setup Node for website checks
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check website and context-cost explorer
        if: runner.os == 'Linux'
        env:
          JOB_RESULTS_DIR: ${{ runner.temp }}/context-cost-results
        run: |
          python3 scripts/generate-website-data.py --check
          python3 scripts/check-website-links.py
          node scripts/test-context-cost.mjs
